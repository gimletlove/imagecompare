name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read CMake version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read project version
        id: version
        run: |
          version="$(awk '$1 == "project(image_compare" && $2 == "VERSION" { print $3; exit }' CMakeLists.txt)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Invalid or missing CMake project version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package-deb:
    name: Debian 13 DEB
    needs: prepare
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      LINUX_PACKAGE_NAME: imagecompare-${{ needs.prepare.outputs.version }}-linux-x86_64
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            file \
            git \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Stage install tree
        run: cmake --install build --prefix "$PWD/stage/linux"

      - name: Archive Linux install tree and source
        run: |
          mkdir -p packages
          cmake -E chdir stage cmake -E tar cf "../packages/${LINUX_PACKAGE_NAME}.zip" --format=zip linux
          git -c safe.directory="$GITHUB_WORKSPACE" archive \
            --format=tar.gz \
            --prefix="imagecompare-${PACKAGE_VERSION}/" \
            --output="packages/imagecompare-${PACKAGE_VERSION}-source.tar.gz" \
            HEAD

      - name: Verify vendored SSIM source archive
        run: |
          archive="packages/imagecompare-${PACKAGE_VERSION}-source.tar.gz"
          prefix="imagecompare-${PACKAGE_VERSION}"
          tar -tzf "$archive" | grep -Fx "$prefix/third_party/ssim/LICENSE"
          tar -tzf "$archive" | grep -Fx "$prefix/third_party/ssim/src/ssim.cpp"

      - name: Build DEB package
        run: cpack --config build/CPackConfig.cmake -G DEB -B packages

      - name: Rename DEB package
        run: mv packages/*.deb "packages/imagecompare-${PACKAGE_VERSION}-linux-amd64.deb"

      - name: Verify DEB runtime metadata
        run: |
          package="packages/imagecompare-${PACKAGE_VERSION}-linux-amd64.deb"
          dpkg-deb -f "$package" Suggests | grep -F "qt6-svg-plugins"
          dpkg-deb -f "$package" Suggests | grep -F "qt6-image-formats-plugins"
          dpkg-deb -f "$package" Suggests | grep -F "kimageformat6-plugins"

      - name: Install DEB without optional handlers
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "./packages/imagecompare-${PACKAGE_VERSION}-linux-amd64.deb"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LINUX_PACKAGE_NAME }}
          path: stage/linux
          if-no-files-found: error

      - name: Upload Debian package inputs
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-deb
          path: |
            packages/*.zip
            packages/*.deb
            packages/*-source.tar.gz
          if-no-files-found: error

  package-rpm:
    name: Fedora 43 RPM
    needs: prepare
    runs-on: ubuntu-24.04
    container: fedora:43
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      LINUX_PACKAGE_NAME: imagecompare-${{ needs.prepare.outputs.version }}-linux-x86_64
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake \
            gcc-c++ \
            git \
            ninja-build \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            rpm-build

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Build RPM package
        run: cpack --config build/CPackConfig.cmake -G RPM -B packages

      - name: Rename RPM package
        run: mv packages/*.rpm "packages/imagecompare-${PACKAGE_VERSION}-linux-x86_64.rpm"

      - name: Verify RPM runtime metadata
        run: |
          package="packages/imagecompare-${PACKAGE_VERSION}-linux-x86_64.rpm"
          rpm -qp --suggests "$package" | grep -Fx "qt6-qtsvg"
          rpm -qp --suggests "$package" | grep -Fx "qt6-qtimageformats"
          rpm -qp --suggests "$package" | grep -Fx "kf6-kimageformats"

      - name: Install RPM without optional handlers
        run: |
          dnf install -y \
            --setopt=install_weak_deps=False \
            "packages/imagecompare-${PACKAGE_VERSION}-linux-x86_64.rpm"

      - name: Upload Fedora package input
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-rpm
          path: packages/*.rpm
          if-no-files-found: error

  package-windows:
    name: Windows Artifacts
    needs: prepare
    runs-on: windows-2025
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      WINDOWS_PACKAGE_NAME: imagecompare-${{ needs.prepare.outputs.version }}-windows-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install prebuilt Windows dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-imageformats:p
            kimageformats:p
            libavif:p
            libjxl:p

      - name: Configure Release build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMAGECOMPARE_FLATPAK=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-windows

      - name: Stage install tree
        shell: msys2 {0}
        run: cmake --install build-windows --prefix "$PWD/stage/windows"

      - name: Stage Windows package
        shell: msys2 {0}
        run: |
          deploy_dir="$PWD/dist/$WINDOWS_PACKAGE_NAME"
          mkdir -p "$deploy_dir"
          cp "$PWD/stage/windows/bin/imagecompare.exe" LICENSE.txt "$deploy_dir"
          export PATH="/ucrt64/share/qt6/bin:$PATH"

          windeployqt6 \
            --release \
            --no-translations \
            --no-opengl-sw \
            --no-system-d3d-compiler \
            --no-system-dxc-compiler \
            --no-compiler-runtime \
            --skip-plugin-types generic,qmltooling,networkinformation,tls \
            --qmldir "$PWD/src/ui/qml" \
            --qml-deploy-dir "$deploy_dir/share/qt6/qml" \
            "$deploy_dir/imagecompare.exe"

          rm -f \
            "$deploy_dir/imageformats/kimg_heif.dll" \
            "$deploy_dir/imageformats/kimg_jp2.dll" \
            "$deploy_dir/imageformats/kimg_kra.dll" \
            "$deploy_dir/imageformats/kimg_ora.dll" \
            "$deploy_dir/imageformats/kimg_raw.dll"
          for style in FluentWinUI3 Imagine Material Universal; do
            rm -rf "$deploy_dir/share/qt6/qml/QtQuick/Controls/$style"
          done
          rm -f \
            "$deploy_dir/Qt6QuickControls2FluentWinUI3StyleImpl.dll" \
            "$deploy_dir/Qt6QuickControls2Imagine.dll" \
            "$deploy_dir/Qt6QuickControls2ImagineStyleImpl.dll" \
            "$deploy_dir/Qt6QuickControls2Material.dll" \
            "$deploy_dir/Qt6QuickControls2MaterialStyleImpl.dll" \
            "$deploy_dir/Qt6QuickControls2Universal.dll" \
            "$deploy_dir/Qt6QuickControls2UniversalStyleImpl.dll"
          # Add only non-Qt DLLs actually referenced by the executable or plugins.
          while true; do
            copied=false
            while IFS= read -r binary; do
              while IFS= read -r dependency; do
                source="/ucrt64/bin/$dependency"
                if [[ -f "$source" && ! -f "$deploy_dir/$dependency" ]]; then
                  cp "$source" "$deploy_dir"
                  copied=true
                fi
              done < <(objdump -p "$binary" | awk '/DLL Name:/ { print $3 }')
            done < <(find "$deploy_dir" -type f \( -iname '*.exe' -o -iname '*.dll' \))
            [[ "$copied" == true ]] || break
          done
          strip "$deploy_dir/imagecompare.exe"

          test -f "$deploy_dir/platforms/qwindows.dll"
          for plugin in qsvg qwebp qtiff kimg_avif kimg_jxl; do
            test -f "$deploy_dir/imageformats/$plugin.dll"
          done
          for unwanted in \
            vc_redist.x64.exe d3dcompiler_47.dll dxcompiler.dll dxil.dll \
            generic qmltooling networkinformation tls; do
            test ! -e "$deploy_dir/$unwanted"
          done
          for style in FluentWinUI3 Imagine Material Universal; do
            test ! -e "$deploy_dir/share/qt6/qml/QtQuick/Controls/$style"
          done
      - name: Smoke-test Windows package
        shell: pwsh
        run: |
          $executable = "$PWD\dist\$env:WINDOWS_PACKAGE_NAME\imagecompare.exe"
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:QML_IMPORT_TRACE = '1'
          $process = Start-Process $executable -PassThru `
            -RedirectStandardOutput "$PWD\imagecompare.stdout.log" `
            -RedirectStandardError "$PWD\imagecompare.stderr.log"
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            Get-Content "$PWD\imagecompare.stdout.log"
            Get-Content "$PWD\imagecompare.stderr.log"
            throw "imagecompare.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WINDOWS_PACKAGE_NAME }}
          path: dist/${{ env.WINDOWS_PACKAGE_NAME }}
          if-no-files-found: error

  publish:
    name: Release Artifacts
    needs:
      - prepare
      - package-deb
      - package-rpm
      - package-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      LINUX_PACKAGE_NAME: imagecompare-${{ needs.prepare.outputs.version }}-linux-x86_64
      WINDOWS_PACKAGE_NAME: imagecompare-${{ needs.prepare.outputs.version }}-windows-x86_64

    steps:
      - name: Download distro packages
        uses: actions/download-artifact@v8
        with:
          pattern: linux-package-*
          path: packages
          merge-multiple: true

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WINDOWS_PACKAGE_NAME }}
          path: windows-package/${{ env.WINDOWS_PACKAGE_NAME }}

      - name: Archive Windows package
        run: |
          cmake -E chdir windows-package cmake -E tar \
            cf "../packages/${WINDOWS_PACKAGE_NAME}.zip" \
            --format=zip "${WINDOWS_PACKAGE_NAME}"

      - name: Upload all packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LINUX_PACKAGE_NAME }}-packages
          path: |
            packages/*.zip
            packages/*.deb
            packages/*.rpm
            packages/*-source.tar.gz
          if-no-files-found: error

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${PACKAGE_VERSION}"
          title="Image Compare ${PACKAGE_VERSION}"
          notes="Draft release for Image Compare ${PACKAGE_VERSION}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$tag" --draft --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" \
            packages/*.zip \
            packages/*.deb \
            packages/*.rpm \
            packages/*-source.tar.gz \
            --clobber
